[target.xtensa-esp32-none-elf]
runner = "espflash flash --chip esp32"

[target.riscv32imc-unknown-none-elf]
runner = "espflash flash --chip esp32c3"

[env]
ESP_LOG="info"

[build]
rustflags = [
  # "-C", "link-arg=-nostartfiles",
  "-C", "force-frame-pointers",
]

target = "riscv32imc-unknown-none-elf"

[unstable]
build-std = ["alloc", "core"]
